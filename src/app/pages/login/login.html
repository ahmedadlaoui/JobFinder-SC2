<div class="login-page">
    <div class="login-left">
        <div class="login-content">
            <div class="login-brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="14" x="2" y="7" rx="2" ry="2" />
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
                </svg>
                <span>JobFinder</span>
            </div>

            <div class="login-header">
                <h1>Welcome back</h1>
                <p>Enter your credentials to access your account</p>
            </div>

            <form class="login-form" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="you@example.com" [(ngModel)]="email" name="email"
                        required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Enter your password" [(ngModel)]="password"
                        name="password" required />
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" />
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-login">Sign in</button>
            </form>

            <p class="signup-text">
                Don't have an account? <a href="#">Sign up</a>
            </p>
        </div>
    </div>
    <div class="login-right">
        <img src="https://images.unsplash.com/photo-1497032628192-86f99bcd76bc?w=1200&q=80" alt="Workspace" />
    </div>
</div>
