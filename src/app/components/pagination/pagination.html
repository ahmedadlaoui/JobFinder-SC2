<nav class="pagination">
    <button class="page-btn prev" [disabled]="currentPage() === 1" (click)="prev()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6" />
        </svg>
        Prev
    </button>
    <div class="page-numbers">
        @for (page of pages(); track page) {
        @if (page === '...') {
        <span class="ellipsis">…</span>
        } @else {
        <button class="page-num" [class.active]="page === currentPage()" (click)="goToPage(page)">
            {{ page }}
        </button>
        }
        }
    </div>
    <button class="page-btn next" [disabled]="currentPage() === totalPages()" (click)="next()">
        Next
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6" />
        </svg>
    </button>
</nav>
